<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Galaxia de Amor</title>
<style>
  :root {
    --ui-bg: rgba(24, 18, 0, .55);
    --ui-border: rgba(255, 205, 70, .45);
    --ui-text: #fff4c2;
    --gold: #ffc933;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #030300;
    font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
  }
  canvas { display: block; position: fixed; inset: 0; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, rgba(255, 210, 60, .10), rgba(0,0,0,0) 45%, rgba(0,0,0,.65) 100%);
  }
  .hint {
    position: fixed; bottom: max(26px, env(safe-area-inset-bottom)); left: 64px; right: 64px; text-align: center;
    color: rgba(255, 235, 170, .8); font-size: 13px; letter-spacing: .03em;
    pointer-events: none; transition: opacity 1.5s;
  }
  .round { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--ui-border); background: var(--ui-bg); color: var(--ui-text); font-size: 20px; cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .round.on { background: linear-gradient(135deg, #ffe066, #ffb300); color: #3a2600; box-shadow: 0 0 22px rgba(255,190,40,.5); }
  .round:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  #letterBtn { left: max(16px, env(safe-area-inset-left)); }
  #music { right: max(16px, env(safe-area-inset-right)); }
  #fs { right: calc(max(16px, env(safe-area-inset-right)) + 56px); }
  .counter { position: fixed; top: 14px; left: 0; right: 0; text-align: center; padding: 0 16px; pointer-events: none;
    font: italic 15px/1.4 Georgia, "Times New Roman", serif; color: #ffe9a6; text-shadow: 0 0 12px rgba(255,190,40,.6); }
  .counter[hidden] { display: none; }
  .intro { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; animation: introOut 1.4s ease 5s forwards; }
  .intro-para { font: italic 22px Georgia, "Times New Roman", serif; color: var(--ui-text); letter-spacing: .06em;
    opacity: 0; animation: lineIn 1.2s ease .3s forwards; }
  .intro-name { font: italic 600 clamp(38px, 9vw, 72px)/1.1 Georgia, "Times New Roman", serif; color: #ffd54a; padding: 0 20px;
    text-shadow: 0 0 30px rgba(255,190,40,.7); opacity: 0; animation: lineIn 1.6s ease 1s forwards; }
  .intro-from { margin-top: 10px; font: italic 20px Georgia, "Times New Roman", serif; color: var(--ui-text);
    opacity: 0; animation: lineIn 1.2s ease 2s forwards; }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }
  .poem.letter .poem-card { width: min(92vw, 500px); }
  .poem.letter .poem-lines p { text-align: left; font-size: 17px; margin-bottom: 14px; }
  .player { position: fixed; z-index: 8; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 58px);
    width: min(92vw, 360px); max-height: min(74vh, 560px); display: flex; flex-direction: column; gap: 10px; padding: 14px;
    border-radius: 20px; background: rgba(20,14,0,.84); border: 1px solid var(--ui-border); box-shadow: 0 0 50px rgba(255,190,40,.2);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: poemIn .3s ease both; }
  .player[hidden] { display: none; }
  .pl-head { display: flex; align-items: center; gap: 12px; padding-right: 30px; position: relative; }
  .pl-cover { position: relative; width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden;
    background: linear-gradient(135deg, #5a3e00, #2a1c00); display: flex; align-items: center; justify-content: center;
    color: var(--gold); font-size: 26px; box-shadow: 0 0 18px rgba(255,190,40,.25); }
  .pl-cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pl-cover img[hidden] { display: none; }
  .pl-info { min-width: 0; flex: 1; }
  .pl-title { font: italic 600 17px/1.25 Georgia, "Times New Roman", serif; color: #ffd54a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-artist { font-size: 13px; color: rgba(255,235,170,.7); margin-top: 2px; }
  .pl-x { position: absolute; top: -4px; right: -6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: transparent;
    color: var(--ui-text); font-size: 14px; cursor: pointer; }
  .pl-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ui-text); font-variant-numeric: tabular-nums; }
  .pl-bar input { flex: 1; min-width: 0; }
  .player input[type=range] { accent-color: #ffc933; }
  .pl-ctrl { display: flex; align-items: center; gap: 6px; }
  .pl-ctrl button { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--ui-border); background: transparent;
    color: var(--ui-text); font-size: 16px; cursor: pointer; }
  .pl-ctrl .pl-main { width: 48px; height: 48px; border: 0; background: linear-gradient(135deg, #ffe066, #ffb300); color: #3a2600; font-size: 18px; }
  .pl-ctrl button.on { background: rgba(255,200,60,.25); border-color: #ffc933; }
  .pl-ctrl button:focus-visible, .pl-x:focus-visible, .pl-item:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .pl-vol { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; margin-left: 6px; font-size: 14px; }
  .pl-vol input { width: 100%; min-width: 0; }
  .pl-error { font-size: 13px; line-height: 1.4; color: #ffb3a0; background: rgba(120,30,0,.35); padding: 8px 10px; border-radius: 10px; }
  .pl-error[hidden] { display: none; }
  .pl-list { list-style: none; margin: 0; padding: 4px 0 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid rgba(255,205,70,.2); }
  .pl-item { display: flex; align-items: center; gap: 10px; padding: 9px 6px; cursor: pointer; border-radius: 8px; color: var(--ui-text); font-size: 14px; }
  .pl-item:hover { background: rgba(255,200,60,.12); }
  .pl-item.active { color: #ffd54a; background: rgba(255,200,60,.16); }
  .pl-ic { width: 18px; text-align: center; flex: none; font-size: 12px; }
  .pl-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-d { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  .np { position: fixed; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 62px); transform: translateX(-50%) translateY(8px);
    max-width: 86vw; padding: 8px 16px; border-radius: 999px; background: var(--ui-bg); border: 1px solid var(--ui-border);
    color: #ffe9a6; font: italic 14px Georgia, "Times New Roman", serif; opacity: 0; pointer-events: none;
    transition: opacity .5s, transform .5s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .np.show { opacity: 1; transform: translateX(-50%); }
  .gallery { position: fixed; inset: 0; z-index: 11; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(2,2,0,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: poemIn .35s ease both; }
  .gallery[hidden] { display: none; }
  .gal-card { position: relative; width: min(96vw, 980px); max-height: 92vh; overflow-y: auto; padding: 28px 22px 22px;
    border-radius: 22px; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(90,62,0,.55), rgba(20,14,0,.94) 70%);
    border: 1px solid var(--ui-border); box-shadow: 0 0 70px rgba(255,190,40,.22); }
  .gal-card h2 { margin: 6px 0 18px; font: italic 600 28px/1.2 Georgia, "Times New Roman", serif;
    color: #ffd54a; text-shadow: 0 0 18px rgba(255,190,40,.55); }
  .gal-photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: center; }
  .gal-photos figure { margin: 0; padding: 10px 10px 8px; background: #fff8dc; border-radius: 6px; cursor: zoom-in;
    box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 0 24px rgba(255,190,40,.25);
    transform: rotate(var(--rot, 0deg)); opacity: 0; animation: photoIn .8s ease forwards; animation-delay: var(--d, 0s); }
  .gal-photos img { display: block; width: 100%; height: auto; max-height: 56vh; object-fit: contain; border-radius: 3px; background: #2a2000; }
  .gal-photos figcaption { margin-top: 8px; font: italic 14px Georgia, "Times New Roman", serif; color: #6b4a00; }
  .ph-missing { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; padding: 14px; border-radius: 3px;
    font: 13px/1.5 "Segoe UI", Arial, sans-serif; color: #7a5a10; background: repeating-linear-gradient(45deg, #f3e3a4, #f3e3a4 10px, #efdb94 10px, #efdb94 20px); }
  .gal-hint { margin: 16px 0 0; font: italic 14px Georgia, "Times New Roman", serif; color: rgba(255,235,170,.7); }
  @media (max-width: 680px) {
    .gal-photos { grid-template-columns: 1fr; gap: 14px; }
    .gal-photos img { max-height: 46vh; }
    .gal-card h2 { font-size: 24px; }
  }
  @keyframes photoIn { from { opacity: 0; transform: translateY(26px) scale(.92) rotate(var(--rot, 0deg)); } to { opacity: 1; transform: rotate(var(--rot, 0deg)); } }
  .lightbox { position: fixed; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(0,0,0,.92); cursor: zoom-out; }
  .lightbox[hidden] { display: none; }
  .lightbox img { max-width: 96vw; max-height: 92vh; border-radius: 6px; box-shadow: 0 0 60px rgba(255,190,40,.3); }
  @media (prefers-reduced-motion: reduce) { .gal-photos figure { animation: none; opacity: 1; } }
  .poem { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(2,2,0,.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: poemIn .35s ease both; }
  .poem[hidden] { display: none; }
  .poem-card { position: relative; width: min(92vw, 440px); max-height: 82vh; overflow-y: auto; padding: 34px 28px 30px;
    border-radius: 22px; text-align: center;
    background: radial-gradient(ellipse at 50% 0%, rgba(90,62,0,.55), rgba(20,14,0,.92) 70%);
    border: 1px solid var(--ui-border); box-shadow: 0 0 70px rgba(255,190,40,.22); }
  .poem-flower { font-size: 34px; }
  .poem-card h2 { margin: 6px 0 18px; font: italic 600 30px/1.2 Georgia, "Times New Roman", serif;
    color: #ffd54a; text-shadow: 0 0 18px rgba(255,190,40,.55); }
  .poem-lines p { margin: 0 0 6px; font: 18px/1.65 Georgia, "Times New Roman", serif; color: var(--ui-text);
    opacity: 0; animation: lineIn .8s ease forwards; }
  .poem-close { position: absolute; top: 10px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--ui-border); background: transparent; color: var(--ui-text); font-size: 16px; cursor: pointer; }
  .poem-close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  @keyframes poemIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes lineIn { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .poem, .poem-lines p { animation: none; opacity: 1; } .intro { display: none; } }
</style>
</head>
<body>
<div class="vignette"></div>
<div class="hint" id="hint">Toca las galaxias lejanas para ver sus fotos · toca las frases y el corazón para leer poemas</div>

<div class="intro" id="intro" aria-hidden="true">
  <div class="intro-para">Para</div>
  <div class="intro-name" id="introName"></div>
  <div class="intro-from" id="introFrom"></div>
</div>
<div class="counter" id="counter" hidden></div>
<button class="round" id="letterBtn" type="button" aria-label="Leer la carta de amor">💌</button>
<button class="round" id="fs" type="button" aria-label="Pantalla completa">⛶</button>
<button class="round" id="music" type="button" aria-expanded="false" aria-controls="player" aria-label="Abrir reproductor de música">♪</button>

<div class="player" id="player" hidden role="region" aria-label="Reproductor de música">
  <div class="pl-head">
    <div class="pl-cover"><span aria-hidden="true">♪</span><img id="plCoverImg" alt="" hidden></div>
    <div class="pl-info"><div class="pl-title" id="plTitle">—</div><div class="pl-artist" id="plArtist"></div></div>
    <button class="pl-x" id="plClose" type="button" aria-label="Cerrar reproductor">✕</button>
  </div>
  <div class="pl-bar"><span id="plCur">0:00</span><input id="plSeek" type="range" min="0" max="1000" value="0" aria-label="Progreso de la canción"><span id="plDur">0:00</span></div>
  <div class="pl-ctrl">
    <button id="plShuffle" type="button" aria-pressed="false" aria-label="Orden aleatorio">🔀</button>
    <button id="plPrev" type="button" aria-label="Canción anterior">⏮</button>
    <button id="plPlay" class="pl-main" type="button" aria-label="Reproducir o pausar">▶</button>
    <button id="plNext" type="button" aria-label="Canción siguiente">⏭</button>
    <label class="pl-vol"><span aria-hidden="true">🔊</span><input id="plVol" type="range" min="0" max="100" value="80" aria-label="Volumen"></label>
  </div>
  <div class="pl-error" id="plError" hidden></div>
  <ul class="pl-list" id="plList"></ul>
</div>
<div class="np" id="np" aria-live="polite"></div>

<div class="gallery" id="gallery" hidden role="dialog" aria-modal="true" aria-labelledby="galTitle">
  <div class="gal-card">
    <button class="poem-close" id="galClose" type="button" aria-label="Cerrar fotos">✕</button>
    <div class="poem-flower" aria-hidden="true">📷</div>
    <h2 id="galTitle"></h2>
    <div class="gal-photos" id="galPhotos"></div>
    <p class="gal-hint">Toca una foto para verla más grande</p>
  </div>
</div>
<div class="lightbox" id="lightbox" hidden><img id="lightImg" alt=""></div>

<div class="poem" id="poem" hidden role="dialog" aria-modal="true" aria-labelledby="poemTitle">
  <div class="poem-card">
    <button class="poem-close" id="poemClose" type="button" aria-label="Cerrar poema">✕</button>
    <div class="poem-flower" id="poemIcon" aria-hidden="true">🌻</div>
    <h2 id="poemTitle"></h2>
    <div class="poem-lines" id="poemLines"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  /* ============ CONFIGURACIÓN (edita aquí) ============ */
  const CONFIG = {
    para: 'Mi amor',   // nombre o apodo de la persona
    de: '',            // tu nombre (opcional)
    fecha: '',         // 'AAAA-MM-DD' para mostrar el tiempo juntos (opcional). Ej: '2023-02-14'
    carpeta: '',       // carpeta de las fotos. Vacío = junto a este archivo. Ej: 'fotos/'
    prefijo: 'foto',   // nombres: foto01.jpeg ... foto18.jpeg (3 fotos por galaxia, 6 galaxias)
    extension: 'jpeg',
    galaxias: ['Nuestros comienzos', 'Risas infinitas', 'Aventuras juntos', 'Días especiales', 'Momentos que amo', 'Siempre contigo'],
    carpetaMusica: '', // carpeta de los .mp3 y sus portadas .png. Vacío = junto a este archivo. Ej: 'musica/'
    musicaAutomatica: true, // empieza a sonar en el primer toque (los navegadores exigen un toque para permitir sonido)
    canciones: [
      { file: 'Princesa de mi corazón ❤️.mp3', portada: 'Princesa de mi corazón.png', titulo: 'Princesa de mi corazón ❤️', artista: 'El corazón', duracion: '6:54' },
      { file: 'No Dejes Que Apaguen Tu Brillo.mp3', portada: 'No Dejes Que Apaguen Tu Brillo.png', titulo: 'No Dejes Que Apaguen Tu Brillo', artista: 'El corazón', duracion: '5:04' },
      { file: 'PÁGINAS DE LUZ.mp3', portada: 'PÁGINAS DE LUZ.png', titulo: 'PÁGINAS DE LUZ', artista: 'El corazón', duracion: '5:58' },
      { file: 'ESPÉRAME HASTA QUE LLEGUE.mp3', portada: 'ESPÉRAME HASTA QUE LLEGUE.png', titulo: 'ESPÉRAME HASTA QUE LLEGUE', artista: 'El corazón', duracion: '4:09' },
      { file: 'CUANDO TÚ QUIERAS.mp3', portada: 'CUANDO TÚ QUIERAS.png', titulo: 'CUANDO TÚ QUIERAS', artista: 'El corazón', duracion: '5:07' },
      { file: 'Cuando llegue a ti.mp3', portada: 'Cuando llegue a ti.png', titulo: 'Cuando llegue a ti', artista: 'El corazón', duracion: '6:11' },
      { file: 'Si Me Dejas Conocerte.mp3', portada: 'Si Me Dejas Conocerte.png', titulo: 'Si Me Dejas Conocerte', artista: 'El corazón', duracion: '4:28' },
      { file: 'La Chica de la Mirada Encantadora.mp3', portada: 'La Chica de la Mirada Encantadora.png', titulo: 'La Chica de la Mirada Encantadora', artista: 'El corazón', duracion: '4:57' },
      { file: 'La Chica de la Mirada.mp3', portada: 'La Chica de la Mirada.png', titulo: 'La Chica de la Mirada', artista: 'El corazón', duracion: '3:27' },
      { file: 'Donde Empieza Tu Luz.mp3', portada: 'Donde Empieza Tu Luz.png', titulo: 'Donde Empieza Tu Luz', artista: 'El corazón', duracion: '3:34' },
      { file: 'Cuando Te Miro.mp3', portada: 'Cuando Te Miro.png', titulo: 'Cuando Te Miro', artista: 'El corazón', duracion: '4:29' },
      { file: 'Me Gustas Más Cada Día.mp3', portada: 'Me Gustas Más Cada Día.png', titulo: 'Me Gustas Más Cada Día', artista: 'El corazón', duracion: '5:01' }
    ],
    carta: [           // {para} se reemplaza por el nombre de arriba
      'Hay personas que llegan y cambian el color de todo, {para}. Tú llegaste y el mundo entero se volvió dorado.',
      'Gracias por las risas sin motivo, por los abrazos que arreglan el día y por quedarte incluso cuando todo se complica.',
      'Contigo aprendí que el amor no hace ruido: vive en los detalles, en una mirada, en un «¿ya llegaste?» dicho con alegría.',
      'Si algún día dudas de cuánto vales, mira el cielo: cada estrella de esta galaxia brilla porque tú existes.',
      'Te amo hoy, te amaré mañana, y seguiré eligiéndote en cada amanecer.'
    ]
  };
  /* ==================================================== */

  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;

  /* ---------- Escena básica ---------- */
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x030300);
  scene.fog = new THREE.FogExp2(0x030300, 0.002);

  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 1200);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  document.body.prepend(renderer.domElement);

  const U = { uTime: { value: 0 }, uPR: { value: DPR } };

  /* ---------- Partículas con shader (brillo suave + parpadeo) ---------- */
  const vert = `
    attribute vec3 aColor; attribute float aSize; attribute float aPhase;
    uniform float uTime, uPR, uJit;
    varying vec3 vColor; varying float vTw;
    void main() {
      vec3 p = position;
      p += vec3(sin(uTime*.8 + aPhase*6.283), cos(uTime*.7 + aPhase*11.0), sin(uTime*.6 + aPhase*8.0)) * uJit;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float tw = .65 + .35 * sin(uTime * (1.5 + aPhase*2.5) + aPhase*40.0);
      gl_PointSize = aSize * uPR * tw * (300.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
      vColor = aColor; vTw = tw;
    }`;
  const frag = `
    varying vec3 vColor; varying float vTw;
    void main() {
      float d = length(gl_PointCoord - .5);
      if (d > .5) discard;
      float a = pow(1.0 - d*2.0, 2.0);
      gl_FragColor = vec4(vColor * (.8 + .6*vTw), a);
    }`;

  function makePoints(pos, col, size, phase, jitter) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    const m = new THREE.ShaderMaterial({
      uniforms: { uTime: U.uTime, uPR: U.uPR, uJit: { value: jitter } },
      vertexShader: vert, fragmentShader: frag,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const p = new THREE.Points(g, m);
    p.frustumCulled = false;
    return p;
  }

  /* ---------- Texturas dibujadas con canvas ---------- */
  function canvasTex(c) {
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    t.generateMipmaps = false;
    return t;
  }
  function newCanvas(w, h) {
    const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
  }

  function glowTex(inner, outer) {
    const c = newCanvas(256, 256), x = c.getContext('2d');
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, inner); g.addColorStop(.35, outer); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    return canvasTex(c);
  }

  function swirlTex() {
    const S = 512, c = newCanvas(S, S), x = c.getContext('2d');
    for (let arm = 0; arm < 4; arm++) {
      for (let k = 0; k < 700; k++) {
        const t = k / 700, r = t * 235, a = arm * Math.PI / 2 + t * 7.5;
        const px = S / 2 + Math.cos(a) * r, py = S / 2 + Math.sin(a) * r;
        const rad = (1 - t) * 12 + 2;

        x.fillStyle = g; x.beginPath(); x.arc(px, py, rad, 0, TAU); x.fill();

    const g = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, 110);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,240,170,.9)');

  function drawSunflower(x, cx, cy, R, rot) {
    x.save(); x.translate(cx, cy); x.rotate(rot);
    const layers = [{ n: 18, len: 1, w: .2, off: 0, c1: '#ff9f00', c2: '#ffcf1f' },
                    { n: 18, len: .9, w: .2, off: Math.PI / 18, c1: '#ffb300', c2: '#ffe44d' }];
    layers.forEach(L => {
      for (let i = 0; i < L.n; i++) {
        x.save(); x.rotate(i / L.n * TAU + L.off);
        const gr = x.createLinearGradient(0, R * .25, 0, R * L.len);
        gr.addColorStop(0, L.c1); gr.addColorStop(1, L.c2);
        x.fillStyle = gr; x.strokeStyle = 'rgba(200,110,0,.55)'; x.lineWidth = Math.max(.6, R * .012);
        x.beginPath(); x.moveTo(0, R * .25);
        x.quadraticCurveTo(R * L.w * 1.1, R * .6 * L.len, 0, R * L.len);
        x.quadraticCurveTo(-R * L.w * 1.1, R * .6 * L.len, 0, R * .25);
        x.fill(); x.stroke(); x.restore();
      }
    });
    const cg = x.createRadialGradient(0, 0, 0, 0, 0, R * .36);
    cg.addColorStop(0, '#6b4218'); cg.addColorStop(.7, '#3d2410'); cg.addColorStop(1, '#2a180a');
    x.fillStyle = cg; x.beginPath(); x.arc(0, 0, R * .36, 0, TAU); x.fill();
    for (let i = 0; i < 140; i++) {
      const r = Math.sqrt(i) * R * .028, a = i * 2.39996;
      if (r > R * .33) break;
      x.fillStyle = `rgba(190,130,55,${.35 + Math.random() * .3})`;
      x.beginPath(); x.arc(Math.cos(a) * r, Math.sin(a) * r, R * .018, 0, TAU); x.fill();
    }
    x.restore();
  }

  /* ================= UNIVERSOS ================= */

    const pal = PAL[palNames[i % palNames.length]];

    const tilt = new THREE.Group(); tilt.rotation.set(rand(-.9, .9), 0, rand(-.6, .6));
    tilt.position.set(x, y, z); tilt.add(pts); scene.add(tilt);

  /* ---------- Reproductor de música (tus canciones) ---------- */

  plShuffle.addEventListener('click', () => {
    shuffleOn = !shuffleOn;
    plShuffle.classList.toggle('on', shuffleOn); plShuffle.setAttribute('aria-pressed', String(shuffleOn));
  });
  plVol.addEventListener('input', () => { audio.volume = plVol.value / 100; });
  plSeek.addEventListener('input', () => { seeking = true; plCur.textContent = fmt(plSeek.value / 1000 * (audio.duration || 0)); });
  plSeek.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = plSeek.value / 1000 * audio.duration;
    seeking = false;
  });
  const setPanel = open => { playerEl.hidden = !open; musicBtn.setAttribute('aria-expanded', String(open)); };
  musicBtn.addEventListener('click', () => {
    if (!started && cur < 0) startMusic();      // primera vez: abre el reproductor y empieza a sonar
    setPanel(playerEl.hidden);
  });
  document.getElementById('plClose').addEventListener('click', () => setPanel(false));

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => audio.play());
      navigator.mediaSession.setActionHandler('pause', () => audio.pause());
      navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
      navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
    } catch (err) { /* sin soporte */ }
  }
  if (CONFIG.musicaAutomatica) {
    const kick = () => { if (!started && cur < 0) startMusic(); };
    ['pointerdown', 'pointerup', 'keydown'].forEach(ev => addEventListener(ev, kick));
  }

  /* ---------- Galería de fotos (3 por galaxia) ---------- */
  const galEl = document.getElementById('gallery'), galTitle = document.getElementById('galTitle'),
        galPhotos = document.getElementById('galPhotos'), galClose = document.getElementById('galClose'),
        lightEl = document.getElementById('lightbox'), lightImg = document.getElementById('lightImg');
  const fotoName = n => CONFIG.prefijo + String(n).padStart(2, '0') + '.' + CONFIG.extension;
  const ROTS = ['-2deg', '1.5deg', '-1deg'];
  function openGallery(gi) {
    galTitle.textContent = (CONFIG.galaxias && CONFIG.galaxias[gi]) || ('Galaxia ' + (gi + 1));
    galPhotos.textContent = '';
    for (let k = 0; k < 3; k++) {
      const n = gi * 3 + k + 1, file = fotoName(n), src = CONFIG.carpeta + file;
      const fig = document.createElement('figure');
      fig.style.setProperty('--rot', ROTS[k]); fig.style.setProperty('--d', (.2 + k * .35) + 's');
      const img = new Image(); img.alt = 'Foto ' + n; img.src = src;
      img.onerror = () => {
        const ph = document.createElement('div'); ph.className = 'ph-missing';
        ph.textContent = 'No se encontró ' + src + '. Coloca la foto junto a este archivo.';
        img.replaceWith(ph); fig.dataset.missing = '1';
      };
      const cap = document.createElement('figcaption'); cap.textContent = 'Recuerdo ' + (k + 1) + ' de 3';
      fig.append(img, cap);
      fig.addEventListener('click', () => { if (fig.dataset.missing) return; lightImg.src = img.src; lightImg.alt = img.alt; lightEl.hidden = false; });
      galPhotos.appendChild(fig);
    }
    galEl.hidden = false; galClose.focus(); galEl.querySelector('.gal-card').scrollTop = 0;
  }
  function closeGallery() { galEl.hidden = true; galPhotos.textContent = ''; }
  galClose.addEventListener('click', closeGallery);
  galEl.addEventListener('click', e => { if (e.target === galEl) closeGallery(); });
  lightEl.addEventListener('click', () => { lightEl.hidden = true; });
  addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!lightEl.hidden) lightEl.hidden = true; else if (!galEl.hidden) closeGallery();
  });

  /* ---------- Carta, pantalla completa, presentación y contador ---------- */
  document.getElementById('letterBtn').addEventListener('click', () => {
    const paras = CONFIG.carta.map(p => p.replace('{para}', CONFIG.para));
    paras.push(CONFIG.de ? 'Con todo mi amor, ' + CONFIG.de + ' 💛' : 'Con todo mi amor 💛');
    showModal('Para ' + CONFIG.para, paras, null, true);
  });
  const fsBtn = document.getElementById('fs');
  if (!document.fullscreenEnabled) fsBtn.hidden = true;
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });

  document.getElementById('introName').textContent = CONFIG.para;
  const introFrom = document.getElementById('introFrom');
  if (CONFIG.de) introFrom.textContent = 'de ' + CONFIG.de; else introFrom.remove();
  setTimeout(() => { const el = document.getElementById('intro'); if (el) el.remove(); }, 6600);

  const startDate = CONFIG.fecha ? new Date(CONFIG.fecha + 'T00:00:00') : null;
  if (startDate && !isNaN(startDate)) {
    const counterEl = document.getElementById('counter');
    const plural = (n, a, b) => n === 1 ? a : b;
    const tick = () => {
      const sec = Math.max(0, Math.floor((Date.now() - startDate.getTime()) / 1000));
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600), m = Math.floor(sec % 3600 / 60), sc = sec % 60;
      counterEl.textContent = 'Juntos hace ' + d + ' ' + plural(d, 'día', 'días') + ', ' + h + ' h, ' + m + ' min y ' + sc + ' s 💛';
    };
    counterEl.hidden = false; tick(); setInterval(tick, 1000);
  }

  /* ---------- Cámara orbital (arrastrar, rueda, pellizco) ---------- */
  const target = new THREE.Vector3(0, 16, 0);
  let theta = 0, phi = 1.2, radius = 105;
  let tTheta = theta, tPhi = phi, tRadius = radius;
  const pointers = new Map();
  let pinchDist = 0;
  const dom = renderer.domElement;

  dom.addEventListener('pointerdown', e => {
    dom.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, t: performance.now(), moved: 0 });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });
  dom.addEventListener('pointermove', e => {
    if (e.pointerType === 'mouse' && pointers.size === 0) {
      const h = pick(e.clientX, e.clientY);
      active.forEach(x => { x.hovered = (x === h); });
      const gh = h ? null : galaxyHit(e.clientX, e.clientY);
      minis.forEach(m => { m.hovered = (m === gh); });
      dom.style.cursor = (h || gh) ? 'pointer' : '';
      if (!h && !gh) trail(e.clientX, e.clientY);
    }
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY; p.moved += Math.abs(dx) + Math.abs(dy);
    if (pointers.size === 1) {
      tTheta -= dx * .005;
      tPhi = Math.min(1.75, Math.max(.5, tPhi - dy * .005));
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist) tRadius = Math.min(170, Math.max(45, tRadius * pinchDist / d));
      pinchDist = d;
    }
  });
  const endPointer = e => {
    const p = pointers.get(e.pointerId);
    if (p && e.type === 'pointerup' && pointers.size === 1 && p.moved < 8 && performance.now() - p.t < 600) {
      const a = pick(e.clientX, e.clientY);
      if (a) openPoem(a); else if (!tapGalaxy(e.clientX, e.clientY) && !tapSculpture(e.clientX, e.clientY)) burst(e.clientX, e.clientY);
    }
    pointers.delete(e.pointerId); pinchDist = 0;
  };
  dom.addEventListener('pointerup', endPointer);
  dom.addEventListener('pointercancel', endPointer);
  dom.addEventListener('wheel', e => {
    e.preventDefault();
    tRadius = Math.min(170, Math.max(45, tRadius * (1 + e.deltaY * .001)));
  }, { passive: false });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 9000);

  /* ---------- Animación ---------- */
  const clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), .05), t = clock.getElapsedTime();
    U.uTime.value = t;

    galaxyGroup.rotation.y += dt * .06;
    swirlGroup.rotation.y += dt * .35;

    // latido del corazón
    const beat = Math.pow(Math.max(0, Math.sin(t * 2.4)), 10) * .07 + Math.pow(Math.max(0, Math.sin(t * 2.4 - .5)), 10) * .03;
    heart.scale.setScalar(1 + beat * (musicPlaying ? 1.8 : 1));
    heart.lookAt(camera.position.x, heart.position.y, camera.position.z);

    // chispas ascendentes
    for (let i = 0; i < SPARK_N; i++) {
      sparkPos[i * 3 + 1] += sparkSpd[i] * dt;
      if (sparkPos[i * 3 + 1] > 90) sparkPos[i * 3 + 1] = -35;
    }
    sparks.geometry.attributes.position.needsUpdate = true;

    // flotantes
    for (const f of floaters) {
      const k = Math.min(1, Math.max(0, (t - f.born) / 1.3)), e = 1 - Math.pow(1 - k, 3);
      f.s.scale.set(f.w * e, f.h * e, 1);
      f.s.position.y = f.base.y + Math.sin(t * f.sp + f.ph) * f.amp;
      f.s.position.x = f.base.x + Math.cos(t * f.sp * .7 + f.ph) * f.amp * .5;
      if (f.spin) f.s.material.rotation = f.rot0 + t * f.spin;
    }

    // cámara
    tTheta += 0; // la rotación manual se mantiene
    theta += (tTheta - theta) * .08;
    phi += (tPhi - phi) * .08;
    radius += (tRadius - radius) * .08;
    const aspect = camera.aspect, fit = Math.max(1, .88 / aspect);
    const sway = Math.sin(t * .12) * .35, R = radius * fit, th = theta + sway;
    camera.position.set(
      target.x + R * Math.sin(phi) * Math.sin(th),
      target.y + R * Math.cos(phi),
      target.z + R * Math.sin(phi) * Math.cos(th)
    );
    camera.lookAt(target);

    // frases automáticas
    now = t;
    if (t > nextSpawn && active.filter(a => !a.user).length < MAX_AUTO && !document.hidden) {
      const [txt, k] = nextPhrase();
      spawnPhrase(txt, k);
      nextSpawn = t + (t < 4 ? .4 : rand(1.4, 2.4));
    }
    for (let i = active.length - 1; i >= 0; i--) {
      const a = active[i], age = t - a.born;
      if (age < 0) { a.s.visible = false; continue; }
      a.s.visible = true;
      if (a.pinned) a.life = Math.max(a.life, age + 2);
      if (age > a.life) {
        scene.remove(a.s); a.s.material.dispose(); active.splice(i, 1);
        continue;
      }
      const fin = Math.min(1, age / 1.2), e = 1 - Math.pow(1 - fin, 3);
      const fout = Math.min(1, (a.life - age) / 1.5);
      a.hover += ((a.hovered ? 1 : 0) - a.hover) * .2;
      a.s.material.opacity = e * fout;
      const sc = e * (1 + .14 * a.hover);
      a.s.scale.set(a.w * sc, a.h * sc, 1);
      a.s.position.set(
        a.base.x + Math.cos(t * a.sp * .7 + a.ph) * a.amp * .5,
        a.base.y + Math.sin(t * a.sp + a.ph) * a.amp + age * .25,
        a.base.z
      );
    }

    updateExtras(t, dt);

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
